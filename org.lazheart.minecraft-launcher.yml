id: org.lazheart.minecraft-launcher
runtime: org.kde.Platform
runtime-version: "5.15-22.08"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm15
command: wrapper.sh
base: io.qt.qtwebengine.BaseApp
base-version: "5.15-22.08"

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=home
  - --talk-name=org.a11y.Bus
  - --env=GTK_IM_MODULE=ibus
  - --env=QT_IM_MODULE=ibus
  - --env=XMODIFIERS=@im=ibus
  - --filesystem=/usr/share/X11/xkb:ro    # <-- montas datos xkb del host (opcional)
  - --env=XKB_CONFIG_ROOT=/usr/share/X11/xkb # <-- para que libxkbcommon encuentre datos (si usas host xkb)

 # 🧩 Evitar errores visuales GTK/Qt
  - --env=GTK_PATH=/app/lib/gtk-3.0/modules
  - --env=QT_STYLE_OVERRIDE=Fusion
  - --env=QTWEBENGINE_CHROMIUM_FLAGS=--no-sandbox
  - --env=QT_QPA_PLATFORMTHEME=qt5ct

  # ⚙️ Librerías necesarias para input y teclado
  - --env=LD_PRELOAD=/app/lib/libevdev.so.2:/app/lib/libxkbcommon.so.0

  # 🧭 Rutas del entorno
  - --env=PATH=/app/bin:/usr/bin:/usr/libexec:/usr/lib:/bin
  - --env=LD_LIBRARY_PATH=/app/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}

  # 🪟 Ventanas / SDL
  - --env=SDL_VIDEO_X11_WMCLASS=minecraft-launcher
  - --env=SDL_VIDEO_X11_WMCLASS=mcpelauncher-client
  - --env=SDL_VIDEO_X11_WMNAME=Minecraft
  - --env=SDL_VIDEO_WAYLAND_WMCLASS=mcpelauncher-client
  - --env=SDL_VIDEO_WAYLAND_WMNAME=Minecraft

build-options:
  cflags: -O2
  cxxflags: -O2
  append-path: /usr/lib/sdk/llvm15/bin
  env:
    LDFLAGS: "-L/app/lib"
    CPPFLAGS: "-I/app/include"
    CMAKE_PREFIX_PATH: "/app:/usr/lib/sdk/qt5/lib/cmake:/usr/lib/sdk/qt5/lib/cmake/Qt5"
    PKG_CONFIG_PATH: "/app/lib/pkgconfig:/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig"
    CC: "clang"
    CXX: "clang++"
modules:
  # Teclado Config: usar autotools para instalar correctamente en /app/share/X11/xkb
  - name: xkb-data
    buildsystem: meson
    config-opts:
      - --prefix=/app
    sources:
      - type: archive
        url: https://xorg.freedesktop.org/releases/individual/data/xkeyboard-config/xkeyboard-config-2.41.tar.xz
        sha256: f02cd6b957295e0d50236a3db15825256c92f67ef1f73bf1c77a4b179edf728f

  # 🔧 Librerías base requeridas
  - name: libzip
    buildsystem: cmake
    builddir: true
    make-args: [ -j4 ]
    sources:
      - type: archive
        url: https://github.com/nih-at/libzip/archive/refs/tags/v1.10.1.tar.gz
        sha256: d56d857d1c3ad4a7f3a4c01a51c6a6e5530e35ab93503f62276e8ba2b306186a

  - name: openssl
    buildsystem: simple
    build-commands:
      - ./config --prefix=/app --openssldir=/app/ssl --libdir=lib
      - make -j4
      - make install_sw
      - mkdir -p /app/lib/pkgconfig
      - echo "prefix=/app" > /app/lib/pkgconfig/openssl.pc
      - echo "exec_prefix=\${prefix}" >> /app/lib/pkgconfig/openssl.pc
      - echo "libdir=\${exec_prefix}/lib" >> /app/lib/pkgconfig/openssl.pc
      - echo "includedir=\${prefix}/include" >> /app/lib/pkgconfig/openssl.pc
      - echo "Name: OpenSSL" >> /app/lib/pkgconfig/openssl.pc
      - echo "Description: OpenSSL cryptography and SSL/TLS toolkit" >> /app/lib/pkgconfig/openssl.pc
      - echo "Version: 3.2.0" >> /app/lib/pkgconfig/openssl.pc
      - echo "Libs: -L\${libdir} -lssl -lcrypto" >> /app/lib/pkgconfig/openssl.pc
      - echo "Cflags: -I\${includedir}" >> /app/lib/pkgconfig/openssl.pc
    sources:
      - type: archive
        url: https://www.openssl.org/source/openssl-3.2.0.tar.gz
        sha256: 14c826f07c7e433706fb5c69fa9e25dab95684844b4c962a2cf1bf183eb4690e

  - name: curl
    buildsystem: autotools
    config-opts:
      - --with-openssl=/app
      - --without-gnutls
      - --without-nss
      - --disable-ldap
      - --disable-ldaps
      - --enable-ipv6
    build-options:
      env:
        PKG_CONFIG_PATH: "/app/lib/pkgconfig"
        LDFLAGS: "-L/app/lib -Wl,-rpath,/app/lib"  # 👈 fuerza a usar /app/lib en tiempo de ejecución
        CPPFLAGS: "-I/app/include"
        LIBS: "-lssl -lcrypto"
        LD_LIBRARY_PATH: "/app/lib"                # 👈 garantiza detección correcta durante build
        OPENSSL_ROOT_DIR: "/app"
        OPENSSL_LIB_DIR: "/app/lib"
        OPENSSL_INCLUDE_DIR: "/app/include"
    sources:
      - type: archive
        url: https://curl.se/download/curl-8.10.1.tar.gz
        sha256: d15ebab765d793e2e96db090f0e172d127859d78ca6f6391d7eafecfd894bbc0

  # 🔀 Abseil debe ir ANTES de protobuf
  
  - name: abseil-cpp
    buildsystem: cmake
    builddir: true
    config-opts:
      - -DCMAKE_CXX_STANDARD=17
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/abseil/abseil-cpp/archive/refs/tags/20240722.0.tar.gz
        sha256: f50e5ac311a81382da7fa75b97310e4b9006474f9560ac46f54a9967f07d4ae3

  - name: protobuf
    buildsystem: cmake   
    builddir: true
    build-options:
      env:
        CXXFLAGS: "-std=c++17"
        CFLAGS: "-fPIC"
    config-opts:
      - -DCMAKE_CXX_STANDARD=17
      - -Dprotobuf_BUILD_TESTS=OFF
      - -Dprotobuf_ABSL_PROVIDER=package
      - -Dprotobuf_UTF8_RANGE_PROVIDER=module
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DCMAKE_PREFIX_PATH=/app/lib/cmake
      - -Wno-dev
      - -DBUILD_DEPS=ON
    make-args:
      - -j4
    sources:
      - type: archive
        url: https://github.com/protocolbuffers/protobuf/archive/refs/tags/v28.2.tar.gz
        sha256: b2340aa47faf7ef10a0328190319d3f3bee1b24f426d4ce8f4253b6f27ce16db

  # 🎮 Dependencias de sistema usadas por el cliente de Minecraft
  - name: libevdev
    buildsystem: meson
    builddir: true
    config-opts:
      - -Dtests=disabled
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/libevdev/libevdev-1.13.1.tar.xz
        sha256: 06a77bf2ac5c993305882bc1641017f5bec1592d6d1b64787bad492ab34f2f36

  - name: alsa-lib
    buildsystem: autotools
    sources:
      - type: archive
        url: https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.11.tar.bz2
        sha256: 9f3f2f69b995f9ad37359072fbc69a3a88bfba081fc83e9be30e14662795bb4d

  - name: libxtst
    buildsystem: autotools
    sources:
      - type: archive
        url: https://x.org/releases/individual/lib/libXtst-1.2.5.tar.gz
        sha256: 244ba6e1c5ffa44f1ba251affdfa984d55d99c94bb925a342657e5e7aaf6d39c

  - name: nlohmann-json
    buildsystem: simple
    build-commands:
      - mkdir -p /app/include/nlohmann
      - install -Dm644 json.hpp /app/include/nlohmann/json.hpp
    sources:
      - type: file
        url: https://github.com/nlohmann/json/releases/download/v3.7.3/json.hpp
        sha256: 3b5d2b8f8282b80557091514d8ab97e27f9574336c804ee666fda673a9b59926

  - name: libcanberra
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-gtk-doc
    sources:
      - type: archive
        url: https://0pointer.de/lennart/projects/libcanberra/libcanberra-0.30.tar.xz
        sha256: c2b671e67e0c288a69fc33dc1b6f1b534d07882c2aceed37004bf48c601afa72
  
  - name: libxkbcommon
    buildsystem: meson
    config-opts:
      - -Denable-docs=false
      - -Denable-wayland=false
    sources:
      - type: archive
        url: https://xkbcommon.org/download/libxkbcommon-1.7.0.tar.xz
        sha256: 65782f0a10a4b455af9c6baab7040e2f537520caa2ec2092805cdfd36863b247

  #  Librerias Python para la UI
  - name: python3-tkinter
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} .
    sources:
      - type: git
        url: https://github.com/iwalton3/tkinter-standalone
        commit: ba946536054f9d27a08aafde21aa18330ce05729
    modules:
      - name: tcl
        buildsystem: autotools
        subdir: unix
        sources:
          - type: archive
            url: https://sourceforge.net/projects/tcl/files/Tcl/8.6.12/tcl8.6.12-src.tar.gz
            sha256: 26c995dd0f167e48b11961d891ee555f680c175f7173ff8cb829f4ebcde4c1a6
        post-install:
          - chmod 755 /app/lib/libtcl*.so
      - name: tk
        buildsystem: autotools
        subdir: unix
        sources:
          - type: archive
            url: https://sourceforge.net/projects/tcl/files/Tcl/8.6.12/tk8.6.12-src.tar.gz
            sha256: 12395c1f3fcb6bed2938689f797ea3cdf41ed5cb6c4766eec8ac949560310630
        post-install:
          - chmod 755 /app/lib/libtk*.so

  - name: python3-customtkinter
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "customtkinter" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/3b/b1/b43b33001a77256b335511e75f257d001082350b8506c8807f30c98db052/customtkinter-5.2.2-py3-none-any.whl
        sha256: 14ad3e7cd3cb3b9eb642b9d4e8711ae80d3f79fb82545ad11258eeffb2e6b37c
      - type: file
        url: https://files.pythonhosted.org/packages/f2/f2/728f041460f1b9739b85ee23b45fa5a505962ea11fd85bdbe2a02b021373/darkdetect-0.8.0-py3-none-any.whl
        sha256: a7509ccf517eaad92b31c214f593dbcf138ea8a43b2935406bbd565e15527a85
      - type: file
        url: https://files.pythonhosted.org/packages/20/12/38679034af332785aac8774540895e234f4d07f7545804097de4b666afd8/packaging-25.0-py3-none-any.whl
        sha256: 29572ef2b1f17581046b3a2227d5c611fb25ec70ca1ba8554b24b0e69331a484

  - name: python3-darkdetect
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "darkdetect" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/f2/f2/728f041460f1b9739b85ee23b45fa5a505962ea11fd85bdbe2a02b021373/darkdetect-0.8.0-py3-none-any.whl
        sha256: a7509ccf517eaad92b31c214f593dbcf138ea8a43b2935406bbd565e15527a85

  - name: python3-pybind11
    buildsystem: simple
    build-commands:
     - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "pybind11" --no-build-isolation
    sources:
    - type: file
      url: https://files.pythonhosted.org/packages/source/p/pybind11/pybind11-2.13.6.tar.gz
      sha256: ba6af10348c12b24e92fa086b39cfba0eff619b61ac77c406167d813b096d39a

  - name: python3-Pillow
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "Pillow" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/f3/af/c097e544e7bd278333db77933e535098c259609c4eb3b85381109602fb5b/pillow-11.1.0.tar.gz
        sha256: 368da70808b36d73b4b390a8ffac11069f8a5c85f29eff1f1b01bcf3ef5b2a20

  # 🚀 Modulos del launcher

  - name: mcpelauncher-extract
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    build-commands:
      - git submodule update --init --recursive
    sources:
      - type: git
        url: https://github.com/minecraft-linux/mcpelauncher-extract.git
        branch: ng

  - name: mcpelauncher-client
    buildsystem: cmake
    builddir: true
    make-args: [ -j4 ]
    build-options:
      env:
        PATH: "/usr/lib/sdk/llvm15/bin:/app/bin:/usr/bin"
        CC: "clang"
        CXX: "clang++"
    sources:
      - type: git
        url: https://github.com/minecraft-linux/mcpelauncher-manifest.git
        branch: ng
      - type: patch
        path: patches/disable-json-fetch.patch
      - type: patch
        path: patches/disable-curl-download.patch
      - type: patch
        path: patches/disable-nlohmann-link-simpleipc.patch
      - type: patch
        path: patches/remove-nlohmann-link-telemetry.patch
    build-commands:
      - git submodule update --init --recursive
      - echo "# disabled in flatpak, using system json.hpp" > ext/json.cmake
      - cmake -B build -S /run/build/mcpelauncher-client
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DENABLE_DEV_PATHS=OFF \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DCMAKE_INSTALL_PREFIX=/app \
          -DCMAKE_PREFIX_PATH="/app:/usr/lib/sdk/qt5/lib/cmake:/usr/lib/sdk/qt5/lib/cmake/Qt5" \
          -DCMAKE_INCLUDE_PATH=/app/include \
          -DCMAKE_LIBRARY_PATH=/app/lib \
          -DUSE_SYSTEM_CURL=ON \
          -DCURL_INCLUDE_DIR=/app/include \
          -DCURL_LIBRARY=/app/lib/libcurl.so \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++
      - make -C build -j4
      - DESTDIR=/app make -C build install
  
  - name: minecraft_launcher_ui
    buildsystem: simple
    build-commands:
      # Instalar el módulo UI completo
      - install -d /app/ui
      - cp -r ui/* /app/ui/

      # Instalar el lanzador Python y assets
      - install -Dm755 src/main.py /app/bin/minecraft-launcher-ui
      - install -Dm755 src/wrapper.sh /app/bin/wrapper.sh

      # Instalar íconos y metadatos
      - install -Dm644 assets/logo.png /app/share/icons/hicolor/256x256/apps/org.lazheart.minecraft-launcher.png
      - install -Dm644 assets/logo.svg /app/share/icons/hicolor/scalable/apps/org.lazheart.minecraft-launcher.svg
      - install -Dm644 src/org.lazheart.minecraft-launcher.desktop /app/share/applications/org.lazheart.minecraft-launcher.desktop
      - install -Dm644 src/org.lazheart.minecraft-launcher.metainfo.xml /app/share/metainfo/org.lazheart.minecraft-launcher.metainfo.xml
    sources:
      - type: git
        url: https://github.com/Lazheart/UI-Minecraft-Launcher-Flatpack
        branch: test