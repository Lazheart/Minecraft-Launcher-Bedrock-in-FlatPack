id: org.lazheart.minecraft-launcher
runtime: org.kde.Platform
runtime-version: "5.15-22.08"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm15
command: wrapper.sh
base: io.qt.qtwebengine.BaseApp
base-version: "5.15-22.08"

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications

build-options:
  cflags: -O2
  cxxflags: -O2
  append-path: /usr/lib/sdk/llvm15/bin
  env:
    LDFLAGS: "-L/app/lib"
    CPPFLAGS: "-I/app/include"
    CMAKE_PREFIX_PATH: "/app:/usr/lib/sdk/qt5/lib/cmake:/usr/lib/sdk/qt5/lib/cmake/Qt5"
    PKG_CONFIG_PATH: "/app/lib/pkgconfig:/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig"
    CC: "clang"
    CXX: "clang++"
modules:
  # 🔧 Librerías base requeridas
  - name: libzip
    buildsystem: cmake
    builddir: true
    make-args: [ -j4 ]
    sources:
      - type: archive
        url: https://github.com/nih-at/libzip/archive/refs/tags/v1.10.1.tar.gz
        sha256: d56d857d1c3ad4a7f3a4c01a51c6a6e5530e35ab93503f62276e8ba2b306186a

  - name: openssl
    buildsystem: simple
    build-commands:
      - ./config --prefix=/app --openssldir=/app/ssl
      - make -j4
      - make install_sw
    sources:
      - type: archive
        url: https://www.openssl.org/source/openssl-3.3.2.tar.gz
        sha256: 2e8a40b01979afe8be0bbfb3de5dc1c6709fedb46d6c89c10da114ab5fc3d281

  - name: curl
    buildsystem: autotools
    config-opts:
      - --with-openssl=/app
      - --without-gnutls
      - --without-nss
      - --disable-ldap
      - --disable-ldaps
      - --enable-ipv6
    build-options:
      env:
        PKG_CONFIG_PATH: "/app/lib/pkgconfig"
        LDFLAGS: "-L/app/lib"
        CPPFLAGS: "-I/app/include"
    sources:
      - type: archive
        url: https://curl.se/download/curl-8.10.1.tar.gz
        sha256: d15ebab765d793e2e96db090f0e172d127859d78ca6f6391d7eafecfd894bbc0

    buildsystem: autotools
    config-opts:
      - --with-openssl=/app
      - --without-gnutls
      - --without-nss
      - --disable-ldap
      - --disable-ldaps
      - --enable-ipv6
    build-options:
      env:
        PKG_CONFIG_PATH: "/app/lib/pkgconfig"
        LDFLAGS: "-L/app/lib"
        CPPFLAGS: "-I/app/include"
    sources:
      - type: archive
        url: https://curl.se/download/curl-8.10.1.tar.gz
        sha256: d15ebab765d793e2e96db090f0e172d127859d78ca6f6391d7eafecfd894bbc0

  # 🔀 Abseil debe ir ANTES de protobuf
  - name: abseil-cpp
    buildsystem: cmake
    builddir: true
    config-opts:
      - -DCMAKE_CXX_STANDARD=17
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/abseil/abseil-cpp/archive/refs/tags/20240722.0.tar.gz
        sha256: f50e5ac311a81382da7fa75b97310e4b9006474f9560ac46f54a9967f07d4ae3

  - name: protobuf
    buildsystem: cmake   
    builddir: true
    build-options:
      env:
        CXXFLAGS: "-std=c++17"
        CFLAGS: "-fPIC"
    config-opts:
      - -DCMAKE_CXX_STANDARD=17
      - -Dprotobuf_BUILD_TESTS=OFF
      - -Dprotobuf_ABSL_PROVIDER=package
      - -Dprotobuf_UTF8_RANGE_PROVIDER=module
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DCMAKE_PREFIX_PATH=/app/lib/cmake
      - -Wno-dev
      - -DBUILD_DEPS=ON
    make-args:
      - -j4
    sources:
      - type: archive
        url: https://github.com/protocolbuffers/protobuf/archive/refs/tags/v28.2.tar.gz
        sha256: b2340aa47faf7ef10a0328190319d3f3bee1b24f426d4ce8f4253b6f27ce16db

  # 🎮 Dependencias de sistema usadas por el cliente de Minecraft
  - name: libevdev
    buildsystem: meson
    builddir: true
    config-opts:
      - -Dtests=disabled
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/libevdev/libevdev-1.13.1.tar.xz
        sha256: 06a77bf2ac5c993305882bc1641017f5bec1592d6d1b64787bad492ab34f2f36

  - name: alsa-lib
    buildsystem: autotools
    sources:
      - type: archive
        url: https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.11.tar.bz2
        sha256: 9f3f2f69b995f9ad37359072fbc69a3a88bfba081fc83e9be30e14662795bb4d

  - name: libxtst
    buildsystem: autotools
    sources:
      - type: archive
        url: https://www.x.org/releases/individual/lib/libXtst-1.2.5.tar.gz
        sha256: 244ba6e1c5ffa44f1ba251affdfa984d55d99c94bb925a342657e5e7aaf6d39c

  - name: nlohmann-json
    buildsystem: simple
    build-commands:
      - mkdir -p /app/include/nlohmann
      - install -Dm644 json.hpp /app/include/nlohmann/json.hpp
    sources:
      - type: file
        url: https://github.com/nlohmann/json/releases/download/v3.7.3/json.hpp
        sha256: 3b5d2b8f8282b80557091514d8ab97e27f9574336c804ee666fda673a9b59926

 #  Librerias Python para la UI
  - name: python3-customtkinter
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "customtkinter" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/3b/b1/b43b33001a77256b335511e75f257d001082350b8506c8807f30c98db052/customtkinter-5.2.2-py3-none-any.whl
        sha256: 14ad3e7cd3cb3b9eb642b9d4e8711ae80d3f79fb82545ad11258eeffb2e6b37c
      - type: file
        url: https://files.pythonhosted.org/packages/f2/f2/728f041460f1b9739b85ee23b45fa5a505962ea11fd85bdbe2a02b021373/darkdetect-0.8.0-py3-none-any.whl
        sha256: a7509ccf517eaad92b31c214f593dbcf138ea8a43b2935406bbd565e15527a85
      - type: file
        url: https://files.pythonhosted.org/packages/20/12/38679034af332785aac8774540895e234f4d07f7545804097de4b666afd8/packaging-25.0-py3-none-any.whl
        sha256: 29572ef2b1f17581046b3a2227d5c611fb25ec70ca1ba8554b24b0e69331a484


  # 🚀 Modulos del launcher

  - name: mcpelauncher-extract
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    build-commands:
      - git submodule update --init --recursive
    sources:
      - type: git
        url: https://github.com/minecraft-linux/mcpelauncher-extract.git
        branch: ng

  - name: mcpelauncher-client
    buildsystem: cmake
    builddir: true
    make-args: [ -j4 ]
    build-options:
      env:
        PATH: "/usr/lib/sdk/llvm15/bin:/app/bin:/usr/bin"
        CC: "clang"
        CXX: "clang++"
    sources:
      - type: git
        url: https://github.com/minecraft-linux/mcpelauncher-manifest.git
        branch: ng
      - type: patch
        path: patches/disable-json-fetch.patch
      - type: patch
        path: patches/disable-curl-download.patch
      - type: patch
        path: patches/disable-nlohmann-link-simpleipc.patch
      - type: patch
        path: patches/remove-nlohmann-link-telemetry.patch
    build-commands:
      - git submodule update --init --recursive
      - echo "# disabled in flatpak, using system json.hpp" > ext/json.cmake
      - cmake -B build -S /run/build/mcpelauncher-client
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DENABLE_DEV_PATHS=OFF \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DCMAKE_INSTALL_PREFIX=/app \
          -DCMAKE_PREFIX_PATH="/app:/usr/lib/sdk/qt5/lib/cmake:/usr/lib/sdk/qt5/lib/cmake/Qt5" \
          -DCMAKE_INCLUDE_PATH=/app/include \
          -DCMAKE_LIBRARY_PATH=/app/lib \
          -DUSE_SYSTEM_CURL=ON \
          -DCURL_INCLUDE_DIR=/app/include \
          -DCURL_LIBRARY=/app/lib/libcurl.so \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++
      - make -C build -j4
      - DESTDIR=/app make -C build install
 
 
  - name: minecraft_launcher_ui
    buildsystem: simple
    build-commands:
      # Instalar el lanzador Python y assets
      - install -Dm755 src/main.py /app/bin/minecraft-launcher-ui
      - install -Dm755 src/wrapper.sh /app/bin/wrapper.sh

      # Instalar íconos y metadatos
      - install -Dm644 assets/logo.png /app/share/icons/hicolor/256x256/apps/org.lazheart.minecraft-launcher.png
      - install -Dm644 assets/logo.svg /app/share/icons/hicolor/scalable/apps/org.lazheart.minecraft-launcher.svg
      - install -Dm644 src/org.lazheart.minecraft-launcher.desktop /app/share/applications/org.lazheart.minecraft-launcher.desktop
      - install -Dm644 src/org.lazheart.minecraft-launcher.appdata.xml /app/share/metainfo/org.lazheart.minecraft-launcher.appdata.xml
    sources:
      - type: git
        url: https://github.com/Lazheart/UI-Minecraft-Launcher-Flatpack
        branch: main